# Baut WMap für Windows, macOS, Linux (RPM, AppImage – je x86_64 und aarch64)
# und Android (AAB für den Play Store + APKs) – wie bei WKeePass.
#
# wuefl-libs kommt dabei von GitHub (siehe .github/actions/wuefl-libs) –
# lokal ist es nur ein Symlink auf das Nachbarprojekt. MapLibre und ECharts
# liegen fest in libs/ und kommen mit dem Checkout.
#
# Die Web-Dateien kopiert je Job ein eigener Schritt (src-tauri/web-kopieren.sh);
# tauri.ci.json schaltet dafür den beforeBuildCommand aus tauri.conf.json ab.
#
# Start: von Hand unter „Actions“ (workflow_dispatch) oder durch einen Tag
# wie `v0.8.0` (git-release: der Tag entsteht aus dem obersten Eintrag in
# appdata/messages.json). Bei einem Tag wird daraus ein Release: Titel und
# Text kommen aus der Tag-Beschreibung, alle gebauten Dateien hängen dran.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            targets: ''
            output: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            # Eine .dmg für Apple Silicon und Intel zugleich
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            output: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/wuefl-libs

      - name: Web-Dateien kopieren
        run: sh src-tauri/web-kopieren.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Kein package.json im Projekt – die Tauri-CLI kommt deshalb über npx.
      - name: Bauen
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --config tauri.ci.json ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: wmap-${{ matrix.name }}
          path: ${{ matrix.output }}

  # RPM und AppImage. Gebaut auf Ubuntu 22.04: Das AppImage läuft nur auf
  # Systemen mit mindestens der glibc, gegen die es gebaut wurde – die ältere
  # hält es breit nutzbar. Feste Dateinamen, damit die Webseite über
  # releases/latest/download/… direkt darauf zeigen kann.
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/wuefl-libs

      - name: Web-Dateien kopieren
        run: sh src-tauri/web-kopieren.sh

      # xdg-utils: Tauri legt xdg-open ins AppImage (Links im Browser öffnen)
      - name: Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev patchelf file xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-${{ matrix.arch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bauen
        working-directory: src-tauri
        env:
          # linuxdeploy ist selbst ein AppImage; ohne FUSE muss es sich entpacken
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx --yes @tauri-apps/cli@2 build --config tauri.ci.json --bundles rpm,appimage

      - name: Feste Dateinamen
        run: |
          B=src-tauri/target/release/bundle
          cp $B/rpm/*.rpm wmap-${{ matrix.arch }}.rpm
          cp $B/appimage/*.AppImage wmap-${{ matrix.arch }}.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: wmap-Linux-${{ matrix.arch }}
          path: |
            wmap-${{ matrix.arch }}.rpm
            wmap-${{ matrix.arch }}.AppImage

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/wuefl-libs

      - name: Web-Dateien kopieren
        run: sh src-tauri/web-kopieren.sh

      # Android-SDK und NDK liegen auf dem Runner schon bereit
      # (ANDROID_HOME, ANDROID_NDK_LATEST_HOME) – nur Java muss passen.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Gradle ruft beim Bauen die Tauri-CLI selbst noch einmal auf – über
      # `npm run tauri`. Ohne package.json bricht rustBuild…Release ab.
      - name: Tauri-CLI über npm
        working-directory: src-tauri
        run: |
          echo '{"private":true,"scripts":{"tauri":"tauri"}}' > package.json
          npm install --no-audit --no-fund --save-dev @tauri-apps/cli@2

      # Upload-Schlüssel aus den Secrets – wie lokal .secrets/wmap.properties.
      # android-einbinden.py trägt damit die Signatur in Gradle ein, Gradle
      # signiert AAB und APKs selbst. Ohne Secrets: Wegwerfschlüssel (zum
      # Ausprobieren gut, für den Play Store und Updates nicht).
      # Anlegen: .secrets/README.md („Für GitHub Actions“).
      - name: Schlüssel bereitlegen
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          JKS="$RUNNER_TEMP/upload.jks"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$JKS"
          else
            echo "::warning::Kein ANDROID_KEYSTORE hinterlegt – signiert mit einem Wegwerfschlüssel."
            KEYSTORE_PASSWORD=wegwerf
            KEY_ALIAS=wmap
            keytool -genkeypair -keystore "$JKS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 365 -storepass "$KEYSTORE_PASSWORD" -dname "CN=WMap Test"
          fi
          {
            echo "storeFile=$JKS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-wmap}"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > "$RUNNER_TEMP/wmap.properties"
          echo "ANDROID_SIGNING=$RUNNER_TEMP/wmap.properties" >> "$GITHUB_ENV"

      # gen/ steht nicht im Repository – das Android-Projekt entsteht hier
      # jedes Mal neu. Symbole, Standortrechte, Bild in Bild und Signatur
      # kommen wie lokal aus tools/android-einbinden.py.
      - name: Android-Projekt erzeugen
        working-directory: src-tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run tauri -- android init --ci
          python3 ../tools/android-einbinden.py
          grep -q 'create("upload")' gen/android/app/build.gradle.kts \
            || { echo "Signatur nicht in Gradle eingetragen" >&2; exit 1; }

      # Das AAB enthält alle Prozessortypen – der Play Store liefert jedem
      # Gerät nur seinen Teil. Die APKs zum Herunterladen je Typ einzeln.
      - name: Bauen
        working-directory: src-tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run tauri -- android build --ci --config tauri.ci.json --aab \
            --target aarch64 --target armv7 --target x86_64
          npm run tauri -- android build --ci --config tauri.ci.json --apk --split-per-abi \
            --target aarch64 --target armv7 --target x86_64

      # arm64 (fast alle Handys) heißt schlicht wmap-android.apk – darauf zeigt
      # die Webseite. Die anderen tragen ihren Typ im Namen.
      - name: Feste Dateinamen und Signatur prüfen
        run: |
          OUT=src-tauri/gen/android/app/build/outputs
          cp "$(find $OUT/bundle -name '*release*.aab' | head -1)" wmap-android.aab
          find $OUT/apk -name '*release*.apk' > apks.txt
          test -s apks.txt || { echo "Keine APK gefunden"; exit 1; }
          while read -r APK; do
            case "$APK" in
              *unsigned*) echo "Unsigniert: $APK" >&2; exit 1 ;;
              *arm64*)  cp "$APK" wmap-android.apk ;;
              *x86_64*) cp "$APK" wmap-android-x86_64.apk ;;
              *arm*)    cp "$APK" wmap-android-armv7.apk ;;
            esac
          done < apks.txt
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs wmap-android.apk | head -1
          keytool -printcert -jarfile wmap-android.aab | grep -m1 -E "Owner|Eigentümer"
          ls -lh wmap-android*
          rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/wmap.properties"

      - uses: actions/upload-artifact@v4
        with:
          name: wmap-Android
          path: |
            wmap-android*.apk
            wmap-android.aab

  # Läuft auch, wenn einzelne Builds scheitern: Das Release enthält dann,
  # was fertig wurde, statt ganz auszufallen. Abgebrochene Läufe nicht.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    needs: [desktop, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # checkout holt beim flachen Klonen nur den Commit, nicht das Tag-Objekt
      # mit seiner Beschreibung – also ausdrücklich nachladen.
      - name: Beschreibung aus dem Tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # Erste Zeile („Version 0.8.0“) wird der Titel, der Rest die
          # Änderungen – je Zeile ein Punkt.
          TITLE=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:subject)')
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)' \
            | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' \
            | sed '/^[[:space:]]*$/d; s/^[-*][[:space:]]*//; s/^/- /' > release-notes.md
          echo "TITLE=WMap ${TITLE:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TITLE }}
          body_path: release-notes.md
          files: dist/**/*
