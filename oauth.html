<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WMap – Anmeldung</title>
    <meta name="robots" content="noindex">
</head>
<body style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center;">
    <p>Anmeldung bei OpenStreetMap …</p>
    <script>
        // Rückkehr von OpenStreetMap: Code an WMap weitergeben
        const p = new URLSearchParams(location.search);
        const data = { type: 'osm-oauth', code: p.get('code'), state: p.get('state'), error: p.get('error') };
        if (window.opener && !window.opener.closed) {
            window.opener.postMessage(data, location.origin);
            window.close();
        } else {
            // Kein Popup (installierte App, gesperrte Fenster): über den Speicher
            try { localStorage.setItem('wmap.osm.return', JSON.stringify(data)); } catch { /* egal */ }
            location.replace('./index.html');
        }
    </script>
</body>
</html>
