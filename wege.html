<!--
  Meine Touren: Karte mit allem Eigenen, daneben das Panel (wuefl-libs
  userDialog: Rechner links, Handy unten – ui/side-panel.js legt es an). Reiter „Geplant“ und
  „Aufgezeichnet“, im Panel Liste oder Detail – ← Übersicht/Liste,
  ✕ zur Karte, Griff zum Einklappen (ui/map-page.js).
-->
<body class="wege-page">
    <section id="map"></section>

    <!-- Inhalt des Panels – zieht beim Start in den userDialog um (ui/side-panel.js) -->
    <div class="wege-src" hidden>
        <div class="wege-content"></div>
    </div>

    <script type="module" src="./js/pages/wege.js"></script>
</body>

</html>
