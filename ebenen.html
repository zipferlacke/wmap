<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="ebenen.page_title">Eigene Ebenen – WMap</title>
    <meta name="description" content="Eigene Kartenebenen in WMap: GeoJSON, GPX und mehr.">
    <!-- Vorschau beim Teilen (WhatsApp, Signal, Telegram …): kleines Logo statt großem Bild -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WMap">
    <meta property="og:locale" content="de_DE">
    <meta property="og:title" content="Ebenen – WMap">
    <meta property="og:description" content="Eigene Kartenebenen in WMap: GeoJSON, GPX und mehr.">
    <meta property="og:image" content="https://app.wuefl.de/wmap/appdata/preview.png">
    <meta property="og:image:width" content="256">
    <meta property="og:image:height" content="256">
    <meta property="og:image:alt" content="WMap-Logo">
    <meta name="twitter:card" content="summary">
    <link rel="manifest" href="./appdata/manifest.json">
    <link rel="icon" href="./appdata/logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#1a73e8">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/tours.css">
    <script type="module" src="./js/core/maplibre.js"></script>
</head>

<body class="tour-page ebenen-page">
    <header class="tour-head panel">
        <a class="button" data-back data-shape="round no-background" href="./index.html" title="Zur Karte" data-i18n-title="ebenen.back">
            <span class="msr">arrow_back</span>
        </a>
        <h1 class="tour-name" data-i18n="ebenen.title">Eigene Ebenen</h1>
    </header>

    <main>
        <section id="map"></section>

        <dialog id="sheet" class="dialog sheet tour-panel" aria-label="Ebenen" data-i18n-aria-label="ebenen.panel_label">
            <button type="button" class="sheet-grip" aria-label="Höhe ändern: ziehen, doppelt tippen für ganz auf oder zu" data-i18n-aria-label="common.sheet.grip"></button>
            <section class="view">
                <!-- Angetipptes Objekt: alle Werte -->
                <div class="feature-info" hidden></div>

                <div class="tour-bar ebenen-bar">
                    <label class="button primary"><span class="msr">upload_file</span> <span data-i18n="ebenen.add.file">GeoJSON laden</span><input type="file" accept=".geojson,.json,application/geo+json,application/json" multiple hidden data-act="file"></label>
                    <button type="button" class="button" data-act="url"><span class="msr">link</span> <span data-i18n="ebenen.add.url">Von Link laden</span></button>
                </div>
                <p class="muted ebenen-intro" data-i18n="ebenen.intro">Eigene Daten als Ebene – z. B. geologische Messpunkte oder Messwerte als GeoJSON.
                    Sie bleiben privat auf diesem Gerät. Zahlenwerte lassen sich als Farbverlauf zeigen.</p>
                <ul class="layer-list"></ul>
            </section>
        </dialog>
    </main>

    <!-- Zurück-Taste: zuerst geladen (js/core/back.js) -->
    <script type="module" src="./js/core/back.js"></script>
    <!-- Abgleich im Service Worker: Bote und Meldungen (js/core/sw-link.js) -->
    <script type="module" src="./js/core/sw-link.js"></script>
    <script type="module" src="./js/pages/ebenen.js"></script>
</body>

</html>
